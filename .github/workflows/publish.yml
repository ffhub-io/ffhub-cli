name: Publish to npm

# 触发：推到 main 就跑。版本号变了才发布，没变就跳过——
# 这是 single source of truth：package.json.version 是发布信号。
# 想发布就 bump version + push；不想发布就不动 version。
on:
  push:
    branches: [main]
  workflow_dispatch: # 也允许手动触发

# 同分支并发跑可能撞 npm publish（一个还在跑另一个就来了），互相覆盖很难调
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm 可信发布（OIDC）必需：GitHub 向 npm 证明身份，不再用 NPM_TOKEN
    steps:
      - uses: actions/checkout@v4

      # 可信发布要求 Node >= 22.14、npm >= 11.5.1。这里只影响构建和发布，
      # CLI 本身仍按 tsup.config.ts 的 node18 目标打包。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check version vs npm registry
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view ffhub version 2>/dev/null || echo "0.0.0")
          echo "package.json: $PKG_VERSION"
          echo "npm registry: $NPM_VERSION"
          if [ "$PKG_VERSION" != "$NPM_VERSION" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Same version already on npm, skipping publish."
          fi

      # 走 npm 可信发布：npmjs.com 上 ffhub 包已登记本仓库的 publish.yml，
      # 不需要 NODE_AUTH_TOKEN。2027-01 起 npm 不再允许用 token 直接发布新版本，
      # 之前的 NPM_TOKEN 在 2026-09 发 1.3.8 时已经 404。
      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.publish }}" = "true" ]; then
            echo "✅ Published ffhub@${{ steps.check.outputs.version }} to npm" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No version change, skipped publish" >> $GITHUB_STEP_SUMMARY
          fi
